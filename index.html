<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuestra Cuenta Regresiva ❤️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&display=swap');

        body {
            font-family: 'Caveat', cursive;
            background: linear-gradient(to bottom, #87CEEB 0%, #98D8E8 30%, #B0E0E6 70%, #C1E8ED 100%);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                /* Clouds */
                radial-gradient(ellipse 300px 100px at 20% 20%, rgba(255, 255, 255, 0.6) 0%, transparent 70%),
                radial-gradient(ellipse 400px 120px at 80% 15%, rgba(255, 255, 255, 0.5) 0%, transparent 70%),
                radial-gradient(ellipse 350px 80px at 60% 30%, rgba(255, 255, 255, 0.4) 0%, transparent 70%),
                radial-gradient(ellipse 250px 60px at 10% 40%, rgba(255, 255, 255, 0.3) 0%, transparent 70%),
                radial-gradient(ellipse 300px 90px at 90% 45%, rgba(255, 255, 255, 0.4) 0%, transparent 70%),
                /* Distant trees at bottom */
                radial-gradient(ellipse 800px 150px at 25% 95%, rgba(34, 139, 34, 0.2) 0%, transparent 70%),
                radial-gradient(ellipse 600px 120px at 75% 93%, rgba(46, 125, 50, 0.15) 0%, transparent 70%),
                radial-gradient(ellipse 900px 100px at 50% 97%, rgba(27, 94, 32, 0.1) 0%, transparent 70%);
            pointer-events: none;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            padding: 20px;
            position: relative;
        }

        .countdown-display {
            text-align: center;
            color: #1565C0;
            margin-bottom: 60px;
        }

        .title {
            font-size: 2.8rem;
            font-weight: 600;
            margin-bottom: 20px;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.1);
        }

        .date-target {
            font-size: 1.5rem;
            font-weight: 400;
            opacity: 0.85;
            margin-bottom: 30px;
        }

        .countdown-numbers {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 20px;
        }

        .time-unit {
            background: rgba(255,255,255,0.8);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(135, 206, 235, 0.3);
            border-radius: 12px;
            padding: 18px;
            min-width: 90px;
            text-align: center;
            box-shadow: 0 2px 15px rgba(0,0,0,0.1);
        }

        .time-number {
            font-size: 2.8rem;
            font-weight: 700;
            display: block;
            color: #0D47A1;
        }

        .time-label {
            font-size: 1.1rem;
            font-weight: 400;
            opacity: 0.8;
            text-transform: lowercase;
            letter-spacing: 1px;
        }

        .birds-container {
            position: relative;
            width: 100%;
            height: 200px;
            margin-top: 40px;
        }

        .bird {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            font-size: 4rem;
            transition: all 2s ease-in-out;
            filter: drop-shadow(2px 2px 4px rgba(0,0,0,0.3));
        }

        .bird-left {
            left: 0;
            transform: translateY(-50%) scaleX(-1);
        }

        .bird-right {
            right: 0;
            transform: translateY(-50%);
        }

        .heart-trail {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            opacity: 0;
            transition: opacity 1s ease-in-out;
            font-size: 1.5rem;
        }

        .progress-bar {
            width: 70%;
            height: 6px;
            background: rgba(255,255,255,0.6);
            border-radius: 3px;
            margin: 40px auto 20px;
            overflow: hidden;
            border: 1px solid rgba(135, 206, 235, 0.3);
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #42A5F5, #64B5F6);
            border-radius: 3px;
            transition: width 1s ease-out;
        }

        .message {
            text-align: center;
            color: #1565C0;
            font-size: 1.4rem;
            font-weight: 400;
            opacity: 0.9;
            margin-top: 20px;
        }

        .security-breach {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(220, 20, 60, 0.95);
            color: white;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            font-size: 1.5rem;
            font-weight: 600;
            box-shadow: 0 0 30px rgba(220, 20, 60, 0.5);
            border: 2px solid #FF6B6B;
            z-index: 1000;
            display: none;
            animation: breach-flash 0.1s infinite alternate;
        }

        @keyframes breach-flash {
            0% { background: rgba(220, 20, 60, 0.95); }
            100% { background: rgba(255, 20, 60, 0.95); }
        }

        .breach-text {
            margin: 10px 0;
        }

        @keyframes heartbeat {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.2); }
        }

        .heart-beat {
            animation: heartbeat 1.5s ease-in-out infinite;
        }

        @media (max-width: 768px) {
            .title { 
                font-size: 2.2rem; 
                font-weight: 600;
            }
            .date-target {
                font-size: 1.3rem;
            }
            .countdown-numbers { 
                gap: 15px;
                flex-wrap: wrap;
            }
            .time-unit {
                min-width: 80px;
                padding: 15px;
            }
            .time-number { 
                font-size: 2.2rem; 
                font-weight: 700;
            }
            .bird { font-size: 3rem; }
            .message {
                font-size: 1.2rem;
            }
            .security-breach {
                font-size: 1.2rem;
                padding: 20px;
                margin: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="countdown-display">
            <h1 class="title">Días Hasta el 15 de Noviembre</h1>
            <div class="date-target">2025</div>
            
            <div class="countdown-numbers">
                <div class="time-unit">
                    <span class="time-number" id="days">--</span>
                    <span class="time-label">días</span>
                </div>
                <div class="time-unit">
                    <span class="time-number" id="hours">--</span>
                    <span class="time-label">horas</span>
                </div>
                <div class="time-unit">
                    <span class="time-number" id="minutes">--</span>
                    <span class="time-label">minutos</span>
                </div>
                <div class="time-unit">
                    <span class="time-number" id="seconds">--</span>
                    <span class="time-label">segundos</span>
                </div>
            </div>
        </div>

        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <div class="birds-container">
            <div class="bird bird-left" id="birdLeft">🐦</div>
            <div class="heart-trail" id="heartTrail">💕</div>
            <div class="bird bird-right" id="birdRight">🐤</div>
        </div>

        <div class="message" id="message">
            Contando los días
        </div>
    </div>

    <div class="security-breach" id="securityBreach">
        <div class="breach-text">🚨 ¡BRECHA DE SEGURIDAD! 🚨</div>
        <div class="breach-text">Hackearon el contador</div>
        <div class="breach-text">187 días restantes!!!</div>
    </div>

    <script>
        // Set target date to November 15th, 2025
        const targetDate = new Date('2025-11-15T00:00:00').getTime();
        const startDate = new Date().getTime();
        const totalDuration = targetDate - startDate;

        // Calculate total days from start to target
        const totalDays = Math.ceil(totalDuration / (1000 * 60 * 60 * 24));
        let lastDayCount = null;
        let breachShown = false;

        function showSecurityBreach() {
            if (!breachShown) {
                breachShown = true;
                document.getElementById('securityBreach').style.display = 'block';
                
                // Hide after 5 seconds
                setTimeout(() => {
                    document.getElementById('securityBreach').style.display = 'none';
                }, 5000);
            }
        }

        function updateCountdown() {
            const now = new Date().getTime();
            const timeLeft = targetDate - now;
            const timeElapsed = now - startDate;
            
            // Calculate time units
            const days = Math.floor(timeLeft / (1000 * 60 * 60 * 24));
            const hours = Math.floor((timeLeft % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((timeLeft % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((timeLeft % (1000 * 60)) / 1000);

            // Show security breach joke after 10 seconds
            if (!breachShown && timeElapsed > 10000) {
                showSecurityBreach();
            }

            // Update display
            document.getElementById('days').textContent = Math.max(0, days);
            document.getElementById('hours').textContent = Math.max(0, hours);
            document.getElementById('minutes').textContent = Math.max(0, minutes);
            document.getElementById('seconds').textContent = Math.max(0, seconds);

            // Only update bird positions when day count changes
            if (lastDayCount === null || lastDayCount !== days) {
                lastDayCount = days;
                
                // Calculate progress based on days only
                const daysElapsed = totalDays - Math.max(0, days);
                const dayProgress = Math.min(100, Math.max(0, (daysElapsed / totalDays) * 100));
                document.getElementById('progressFill').style.width = dayProgress + '%';

                // Move birds closer based on day progress
                const containerWidth = document.querySelector('.birds-container').offsetWidth;
                const birdLeftEl = document.getElementById('birdLeft');
                const birdRightEl = document.getElementById('birdRight');
                
                // Start birds at opposite edges (0% and 100% of container width)
                // Move them closer as days pass - they meet around 15% from each edge
                const maxDistance = 0; // Start at very edges
                const minDistance = 35; // End position (percentage from edge)
                const currentDistance = maxDistance + (dayProgress / 100) * (minDistance - maxDistance);
                
                birdLeftEl.style.left = currentDistance + '%';
                birdRightEl.style.right = currentDistance + '%';

                // Show hearts when birds are close (last 10% of days)
                const heartTrail = document.getElementById('heartTrail');
                if (dayProgress > 90) {
                    heartTrail.style.opacity = '1';
                    heartTrail.classList.add('heart-beat');
                }
            }

            // Update message based on time left
            const messageEl = document.getElementById('message');
            if (timeLeft <= 0) {
                messageEl.textContent = "El día ha llegado";
            } else if (days <= 1) {
                messageEl.textContent = "Mañana es el día";
            } else if (days <= 7) {
                messageEl.textContent = "Queda una semana";
            } else if (days <= 30) {
                messageEl.textContent = "Casi llegamos";
            } else {
                messageEl.textContent = "Contando los días";
            }

            // Continue countdown if time hasn't reached zero
            if (timeLeft > 0) {
                setTimeout(updateCountdown, 1000);
            }
        }

        // Start the countdown
        updateCountdown();

        // Handle window resize
        window.addEventListener('resize', () => {
            // Recalculate bird positions on resize using current day progress
            const now = new Date().getTime();
            const timeLeft = targetDate - now;
            const days = Math.floor(timeLeft / (1000 * 60 * 60 * 24));
            const daysElapsed = totalDays - Math.max(0, days);
            const dayProgress = Math.min(100, Math.max(0, (daysElapsed / totalDays) * 100));
            
            const maxDistance = 0;
            const minDistance = 35;
            const currentDistance = maxDistance + (dayProgress / 100) * (minDistance - maxDistance);
            
            document.getElementById('birdLeft').style.left = currentDistance + '%';
            document.getElementById('birdRight').style.right = currentDistance + '%';
        });

        // Hide security breach when clicked
        document.getElementById('securityBreach').addEventListener('click', () => {
            document.getElementById('securityBreach').style.display = 'none';
        });
    </script>
</body>
</html>
