<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nuestra Cuenta Regresiva ❤️</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}

body {
  font-family:'Caveat',cursive;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  overflow-x:hidden;
  background:linear-gradient(to bottom,#5BA8D4 0%,#87CEEB 45%,#B8E4F0 72%,#6BAF45 72%,#4E9233 100%);
  background-attachment:fixed;
}

.cloud{position:fixed;background:white;border-radius:50px;opacity:0.82;pointer-events:none}
.cloud::before,.cloud::after{content:'';position:absolute;background:white;border-radius:50%}
.cloud1{width:120px;height:36px;top:5%;left:4%;animation:drift 18s ease-in-out infinite alternate}
.cloud1::before{width:58px;height:58px;top:-30px;left:14px}
.cloud1::after{width:44px;height:44px;top:-22px;left:54px}
.cloud2{width:88px;height:26px;top:11%;right:7%;animation:drift 23s ease-in-out infinite alternate-reverse}
.cloud2::before{width:44px;height:44px;top:-22px;left:10px}
.cloud2::after{width:34px;height:34px;top:-17px;left:40px}
.cloud3{width:70px;height:22px;top:23%;left:28%;animation:drift 15s ease-in-out infinite alternate}
.cloud3::before{width:34px;height:34px;top:-17px;left:8px}
.cloud3::after{width:28px;height:28px;top:-14px;left:30px}
@keyframes drift{0%{transform:translateX(0)}100%{transform:translateX(22px)}}

.container{width:100%;max-width:860px;padding:28px 20px 20px;position:relative;z-index:1}

.speech-bubble{position:relative;background:#fff;border:3.5px solid #1a1a1a;border-radius:16px;
  box-shadow:5px 5px 0 #1a1a1a;padding:18px 28px;text-align:center;margin-bottom:28px}
.speech-bubble::after{content:'';position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);
  border:9px solid transparent;border-top-color:#1a1a1a}
.speech-bubble::before{content:'';position:absolute;bottom:-12px;left:50%;transform:translateX(-50%);
  border:8px solid transparent;border-top-color:#fff;z-index:1}
.speech-bubble h1{font-size:2.4rem;font-weight:700;color:#1a1a1a;line-height:1.1}
.speech-bubble .subtitle{font-size:1.3rem;color:#555;margin-top:4px}

.countdown-row{display:flex;justify-content:center;gap:16px;margin:28px 0 16px;flex-wrap:wrap}
.time-unit{background:#fff;border:3.5px solid #1a1a1a;border-radius:16px;box-shadow:5px 5px 0 #1a1a1a;
  padding:14px 10px;min-width:100px;text-align:center;transition:transform .15s;cursor:default}
.time-unit:hover{transform:translate(-2px,-2px);box-shadow:7px 7px 0 #1a1a1a}
.time-number{display:block;font-size:3rem;font-weight:700;color:#1565C0;line-height:1}
.time-label{font-size:1.1rem;color:#555;margin-top:4px;display:block}

.progress-wrap{margin:8px auto 4px;width:85%}
.progress-track{height:18px;background:#fff;border:3px solid #1a1a1a;border-radius:99px;overflow:hidden;box-shadow:3px 3px 0 #1a1a1a}
.progress-fill{height:100%;background:repeating-linear-gradient(45deg,#FF69B4,#FF69B4 8px,#FF9EC4 8px,#FF9EC4 16px);
  border-radius:99px;transition:width 1s ease-out}
.progress-pct{text-align:center;font-size:1.2rem;font-weight:600;color:#1a1a1a;margin-top:6px}

/* Bird scene
   🐦 blue bird naturally faces LEFT in most renderers.
   We want it to face RIGHT (toward yellow bird on the right).
   So we flip blue bird: scaleX(-1).
   🐤 yellow bird naturally faces RIGHT — we leave it as-is, it already looks left-ish / forward.
   Actually 🐤 faces forward. We want yellow to face left toward blue, so flip yellow too.
*/
.bird-scene{position:relative;width:100%;height:90px;margin:24px 0 8px}
.bird-left-wrap{position:absolute;top:18px;left:var(--bl,5%);transition:left 1.5s cubic-bezier(.4,0,.2,1)}
.bird-right-wrap{position:absolute;top:18px;right:var(--br,5%);transition:right 1.5s cubic-bezier(.4,0,.2,1)}

.bird-emoji{font-size:3.2rem;display:block;cursor:pointer;line-height:1;
  animation:birdBob 1.4s ease-in-out infinite;
  display:inline-block;
}
/* blue bird (left): flip so it faces right toward center */
.bird-left-wrap .bird-emoji{ transform: scaleX(-1); }
/* yellow bird (right): no flip — 🐤 naturally faces roughly forward/left */
.bird-right-wrap .bird-emoji{ transform: none; }

@keyframes birdBob{0%,100%{transform:translateY(0) scaleX(var(--sx,1))}50%{transform:translateY(-8px) scaleX(var(--sx,1))}}

/* Override bob animation per side to keep flip intact */
.bird-left-wrap .bird-emoji{
  animation: birdBobLeft 1.4s ease-in-out infinite;
}
.bird-right-wrap .bird-emoji{
  animation: birdBobRight 1.4s ease-in-out infinite;
}
@keyframes birdBobLeft{
  0%,100%{transform:scaleX(-1) translateY(0)}
  50%{transform:scaleX(-1) translateY(-8px)}
}
@keyframes birdBobRight{
  0%,100%{transform:scaleX(1) translateY(0)}
  50%{transform:scaleX(1) translateY(-8px)}
}

.bird-left-wrap .bird-emoji:hover{ transform:scaleX(-1) scale(1.25) !important; animation:none; }
.bird-right-wrap .bird-emoji:hover{ transform:scale(1.25) !important; animation:none; }

.heart-burst{position:absolute;top:8px;left:50%;transform:translateX(-50%);display:flex;gap:6px;
  opacity:0;transition:opacity .8s;pointer-events:none}
.heart-burst.show{opacity:1}
.heart-item{font-size:1.6rem;animation:heartFloat 2.2s ease-in-out infinite}
.heart-item:nth-child(2){animation-delay:.4s}
.heart-item:nth-child(3){animation-delay:.8s}
@keyframes heartFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}

.message{text-align:center;font-size:1.4rem;color:#1a1a1a;margin:10px 0 20px;min-height:2rem}

.stats-row{display:flex;justify-content:center;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.stat-card{background:#fff;border:3.5px solid #1a1a1a;border-radius:16px;box-shadow:5px 5px 0 #1a1a1a;
  padding:14px 22px;text-align:center;min-width:140px;transition:transform .15s}
.stat-card:hover{transform:translate(-2px,-2px);box-shadow:7px 7px 0 #1a1a1a}
.stat-number{display:block;font-size:1.9rem;font-weight:700;color:#0D47A1}
.stat-label{font-size:1rem;color:#555;margin-top:2px}

/* Snoopy walking strip
   Strip image: 648x204px, 6 frames each 108px wide
   We show one frame at a time via background-position stepping
*/
.snoopy-strip{
  width:100%;max-width:860px;
  border-top:3px solid #1a1a1a;
  overflow:hidden;
  position:relative;
  /* tall enough for full Snoopy: 204px sprite + padding */
  height:180px;
  z-index:1;
  background:rgba(255,255,255,0.1);
}

.snoopy-walker{
  position:absolute;
  bottom:0;            /* anchor to bottom so feet touch ground */
  width:108px;         /* one frame width at 3x */
  height:204px;        /* frame height at 3x */
  animation: walkAcross 14s linear infinite;
  overflow:hidden;
}
@keyframes walkAcross{
  0%  { left:-130px; }
  100%{ left:calc(100% + 20px); }
}

<body>

<div class="cloud cloud1"></div>
<div class="cloud cloud2"></div>
<div class="cloud cloud3"></div>

<div class="container">

  <div class="speech-bubble">
    <h1>Días hasta el 17 de julio</h1>
  </div>

  <div class="countdown-row">
    <div class="time-unit"><span class="time-number" id="days">--</span><span class="time-label">días</span></div>
    <div class="time-unit"><span class="time-number" id="hours">--</span><span class="time-label">horas</span></div>
    <div class="time-unit"><span class="time-number" id="minutes">--</span><span class="time-label">minutos</span></div>
    <div class="time-unit"><span class="time-number" id="seconds">--</span><span class="time-label">segundos</span></div>
  </div>

  <div class="progress-wrap">
    <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    <div class="progress-pct" id="progressPct">0% completado</div>
  </div>

  <div class="bird-scene">
    <div class="bird-left-wrap" id="birdLeftWrap">
      <span class="bird-emoji" onclick="chirp(event)">🐦</span>
    </div>
    <div class="heart-burst" id="heartBurst">
      <span class="heart-item">💕</span>
      <span class="heart-item">❤️</span>
      <span class="heart-item">💖</span>
    </div>
    <div class="bird-right-wrap" id="birdRightWrap">
      <span class="bird-emoji" onclick="chirp(event)">🐤</span>
    </div>
  </div>

  <div class="message" id="message">🐾 Contando los días...</div>

  <div class="stats-row">
    <div class="stat-card"><span class="stat-number" id="totalHours">--</span><span class="stat-label">horas totales</span></div>
    <div class="stat-card"><span class="stat-number" id="totalMinutes">--</span><span class="stat-label">minutos totales</span></div>
    <div class="stat-card"><span class="stat-number" id="percentComplete">--</span><span class="stat-label">completado</span></div>
  </div>

</div>

<!-- Walking Snoopy — full height, no clipping -->
<div class="snoopy-strip">
  <div class="snoopy-walker">
    <div class="snoopy-walker-inner"></div>
  </div>
</div>

<script>
const targetDate = new Date('2026-07-17T00:00:00').getTime();
const startDate  = new Date('2025-12-08T00:00:00').getTime();
const totalDuration = targetDate - startDate;
let lastDay = null;

function pad(n){ return String(Math.max(0,n)).padStart(2,'0'); }

function updateBirds(progress){
  const start=5, end=42;
  const pos = start+(progress/100)*(end-start);
  document.getElementById('birdLeftWrap').style.setProperty('--bl', pos+'%');
  document.getElementById('birdRightWrap').style.setProperty('--br', pos+'%');
  document.getElementById('heartBurst').classList.toggle('show', progress>60);
}

function updateMessage(days){
  const msgs=[
    [1,'🎉 ¡Mañana es el día!'],
    [3,'🐾 ¡Solo 3 días más!'],
    [7,'⭐ ¡Una semana!'],
    [14,'🌟 ¡Dos semanas!'],
    [30,'🐦 Un mes más...'],
    [Infinity,'🐾 Contando los días...']
  ];
  for(let [d,m] of msgs){ if(days<=d){ document.getElementById('message').textContent=m; break; }}
}

function tick(){
  const now=Date.now();
  const left=targetDate-now;
  const elapsed=now-startDate;
  const d=Math.max(0,Math.floor(left/864e5));
  const h=Math.max(0,Math.floor((left%864e5)/36e5));
  const m=Math.max(0,Math.floor((left%36e5)/6e4));
  const s=Math.max(0,Math.floor((left%6e4)/1000));
  document.getElementById('days').textContent=pad(d);
  document.getElementById('hours').textContent=pad(h);
  document.getElementById('minutes').textContent=pad(m);
  document.getElementById('seconds').textContent=pad(s);
  const totalH=Math.max(0,Math.floor(left/36e5));
  const totalM=Math.max(0,Math.floor(left/6e4));
  document.getElementById('totalHours').textContent=totalH.toLocaleString();
  document.getElementById('totalMinutes').textContent=totalM.toLocaleString();
  const pct=Math.min(100,Math.max(0,(elapsed/totalDuration)*100));
  document.getElementById('progressFill').style.width=pct+'%';
  document.getElementById('progressPct').textContent=pct.toFixed(1)+'% completado';
  document.getElementById('percentComplete').textContent=pct.toFixed(1)+'%';
  if(lastDay!==d){ lastDay=d; updateBirds(pct); updateMessage(d); }
  if(left>0) setTimeout(tick,1000);
}

function chirp(e){
  const el=e.target;
  const isLeft=!!el.closest('.bird-left-wrap');
  el.style.animation='none';
  el.style.transform = isLeft ? 'scaleX(-1) scale(1.35)' : 'scale(1.35)';
  setTimeout(()=>{
    el.style.transform='';
    el.style.animation='';
  },200);
  for(let i=0;i<8;i++){
    const dot=document.createElement('div');
    dot.style.cssText='position:fixed;width:9px;height:9px;border-radius:50%;'
      +'background:hsl('+Math.floor(Math.random()*360)+',80%,60%);'
      +'left:'+(e.clientX+(Math.random()-.5)*70)+'px;'
      +'top:'+(e.clientY+(Math.random()-.5)*70)+'px;'
      +'pointer-events:none;z-index:9999;animation:popOut .6s ease-out forwards;';
    document.body.appendChild(dot);
    setTimeout(()=>dot.remove(),700);
  }
}

const st=document.createElement('style');
st.textContent='@keyframes popOut{0%{opacity:1;transform:scale(0)}60%{opacity:1;transform:scale(1.4)}100%{opacity:0;transform:translateY(-30px) scale(1)}}';
document.head.appendChild(st);

tick();
updateBirds(0);
</script>
</body>
</html>
